<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SeaWorld San Diego - Trip Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap');
    * {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    .viewport {
      position: relative;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      background: #8dcce8;
    }

    .map-container {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* 대형 고대비 하이라이트 핀 디자인 (아이콘 크기 초대형 확대) */
    .custom-pin {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      color: #ffffff;
      border: 4.5px solid #ffffff;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.75), 0 0 0 3px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease-out;
      z-index: 25;
    }

    .custom-pin::after {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 9999px;
      background: inherit;
      opacity: 0.45;
      animation: pin-glow 1.8s infinite ease-out;
      z-index: -1;
    }

    @keyframes pin-glow {
      0% { transform: scale(0.85); opacity: 0.7; }
      50% { transform: scale(1.55); opacity: 0; }
      100% { transform: scale(0.85); opacity: 0; }
    }

    .custom-pin.active-pin {
      z-index: 50 !important;
      outline: 5px solid #ffffff;
      box-shadow: 0 0 0 6px #000000, 0 16px 36px rgba(0,0,0,0.9) !important;
    }

    /* 또렷한 초대형 핀 라벨 */
    .custom-label {
      position: absolute;
      transform: translate(22px, -50%);
      background: rgba(15, 23, 42, 0.96);
      color: #ffffff;
      border: 2.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      padding: 5px 12px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -0.01em;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.75);
      z-index: 24;
    }

    .custom-label.active-label {
      background: #ffffff;
      color: #0f172a;
      border-color: #000000;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.85);
      z-index: 51;
    }

    /* 내 위치 파란색 펄스 마커 (필터 핀과 동일한 52px 초대형 + YOU 태그 제거) */
    .user-location-marker {
      position: absolute;
      width: 52px;
      height: 52px;
      background: radial-gradient(circle, #38bdf8 15%, #2563eb 80%, #1e40af 100%);
      border: 4.5px solid #ffffff;
      border-radius: 9999px;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 28px rgba(37, 99, 235, 1), 0 8px 25px rgba(0, 0, 0, 0.7);
      z-index: 60;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }
    .user-location-marker::after {
      content: '';
      position: absolute;
      inset: -16px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.55);
      animation: user-ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      z-index: -1;
    }
    @keyframes user-ping {
      0% { transform: scale(0.7); opacity: 0.95; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* 스크롤바 커스텀 */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- Minimal Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between z-30 flex-shrink-0">
    <div class="flex items-center gap-2">
      <span class="text-xl">🐬</span>
      <div>
        <h1 class="font-black text-sm tracking-wide text-white flex items-center gap-1.5 leading-tight">
          SEAWORLD SAN DIEGO
          <span class="bg-sky-500 text-slate-950 text-[10px] px-1.5 py-0.5 rounded font-black uppercase">Guide</span>
        </h1>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <!-- 내 위치 찾기 버튼 추가 -->
      <button id="btnLocateMe" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 font-bold transition shadow">
        <i class="fa-solid fa-location-crosshairs text-white animate-pulse"></i>
        <span>My Location</span>
      </button>
      <button id="btnRecenter" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1.5 font-bold transition">
        <i class="fa-solid fa-expand text-sky-400"></i>
        <span>Fit Map</span>
      </button>
      <button id="btnToggleList" class="md:hidden bg-sky-500 hover:bg-sky-400 text-slate-950 text-xs px-3 py-1.5 rounded-lg font-black flex items-center gap-1.5 shadow">
        <i class="fa-solid fa-bars"></i>
        <span>List</span>
      </button>
    </div>
  </header>

  <!-- Filter Buttons Strip -->
  <nav class="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-3 py-2 z-20 overflow-x-auto flex items-center gap-2 flex-shrink-0">
    <!-- Show -->
    <button data-cat="show" class="filter-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-black transition-all bg-slate-800 text-slate-300 border border-slate-700 hover:border-slate-500 whitespace-nowrap">
      <span class="w-3 h-3 rounded-full bg-[#ff2a55] inline-block shadow-[0_0_8px_#ff2a55]"></span>
      <span>Timed Shows</span>
      <span class="opacity-60 text-[11px]">(3)</span>
    </button>
    <!-- Indoor -->
    <button data-cat="indoor" class="filter-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-black transition-all bg-slate-800 text-slate-300 border border-slate-700 hover:border-slate-500 whitespace-nowrap">
      <span class="w-3 h-3 rounded-full bg-[#00d2ff] inline-block shadow-[0_0_8px_#00d2ff]"></span>
      <span>Indoor</span>
      <span class="opacity-60 text-[11px]">(6)</span>
    </button>
    <!-- Outdoor -->
    <button data-cat="outdoor" class="filter-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-black transition-all bg-slate-800 text-slate-300 border border-slate-700 hover:border-slate-500 whitespace-nowrap">
      <span class="w-3 h-3 rounded-full bg-[#ffaa00] inline-block shadow-[0_0_8px_#ffaa00]"></span>
      <span>Outdoor</span>
      <span class="opacity-60 text-[11px]">(3)</span>
    </button>
    <!-- Dining -->
    <button data-cat="dining" class="filter-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-black transition-all bg-slate-800 text-slate-300 border border-slate-700 hover:border-slate-500 whitespace-nowrap">
      <span class="w-3 h-3 rounded-full bg-[#10b981] inline-block shadow-[0_0_8px_#10b981]"></span>
      <span>All-Day Dining</span>
      <span class="opacity-60 text-[11px]">(6)</span>
    </button>
    <!-- Rides (Rescue Jr & Octarock only) -->
    <button data-cat="ride" class="filter-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-black transition-all bg-slate-800 text-slate-300 border border-slate-700 hover:border-slate-500 whitespace-nowrap">
      <span class="w-3 h-3 rounded-full bg-[#b026ff] inline-block shadow-[0_0_8px_#b026ff]"></span>
      <span>Rides (2)</span>
    </button>
    <!-- Restroom (All Locations in Park) -->
    <button data-cat="restroom" class="filter-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-black transition-all bg-slate-800 text-slate-300 border border-slate-700 hover:border-slate-500 whitespace-nowrap">
      <span class="w-3 h-3 rounded-full bg-[#38bdf8] inline-block shadow-[0_0_8px_#38bdf8]"></span>
      <span>Restrooms</span>
      <span class="opacity-60 text-[11px]">(12)</span>
    </button>

    <div class="h-4 w-[1px] bg-slate-700 mx-1"></div>

    <button id="btnShowAll" class="px-2.5 py-1.5 rounded-full text-xs font-black bg-slate-800 text-slate-400 hover:text-white transition whitespace-nowrap">
      Show All
    </button>
  </nav>

  <!-- Main View Area -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- Interactive Canvas -->
    <main class="flex-1 flex flex-col relative h-full overflow-hidden bg-slate-900">
      <div id="viewport" class="viewport flex-1 cursor-grab active:cursor-grabbing w-full h-full relative">
        <div id="mapWrapper" class="map-container inline-block">
          <img id="mapImage" 
               src="https://seaworld.com/san-diego/-/media/commercial/seaworld-san-diego/images/park-maps/swc-map-1001-park-map-spooktacular-081126-r4-ds-comp.jpg" 
               alt="SeaWorld Map" 
               class="max-w-none block select-none pointer-events-none"
               style="width: 2200px; height: auto;"
               loading="eager" />

          <!-- Overlaid Pin Layer -->
          <div id="pinsLayer" class="absolute inset-0 pointer-events-auto"></div>

          <!-- User GPS Marker (52px 대형 마커 내부에 나침반/위치 아이콘 탑재) -->
          <div id="userMarker" class="user-location-marker hidden">
            <i class="fa-solid fa-location-crosshairs text-2xl drop-shadow"></i>
          </div>
        </div>

        <!-- Floating Zoom Controls -->
        <div class="absolute right-4 bottom-5 z-30 flex flex-col gap-1.5 bg-slate-900/90 backdrop-blur rounded-2xl p-1.5 border border-slate-700 shadow-2xl">
          <button id="btnZoomIn" title="Zoom In" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-white flex items-center justify-center font-bold text-base transition">
            <i class="fa-solid fa-plus"></i>
          </button>
          <button id="btnZoomReset" title="Reset Zoom" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-sky-400 flex items-center justify-center font-extrabold text-[11px] transition">
            <span id="zoomDisplay">100%</span>
          </button>
          <button id="btnZoomOut" title="Zoom Out" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-white flex items-center justify-center font-bold text-base transition">
            <i class="fa-solid fa-minus"></i>
          </button>
        </div>

        <!-- Quick Info Bottom Card (Dismissible) -->
        <div id="quickCard" class="absolute left-4 right-4 sm:left-6 sm:right-auto sm:w-80 bottom-5 bg-slate-900/95 backdrop-blur-md rounded-2xl p-3.5 border border-slate-700 shadow-2xl z-30 transition-all duration-200 transform translate-y-4 opacity-0 pointer-events-none">
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0">
              <span id="cardBadge" class="w-8 h-8 rounded-xl flex items-center justify-center text-white text-xs font-black shadow-md flex-shrink-0">
                <i id="cardIcon" class="fa-solid fa-location-dot"></i>
              </span>
              <div class="min-w-0">
                <span id="cardCategory" class="text-[10px] font-black uppercase tracking-wider text-slate-400 block">Category</span>
                <h3 id="cardTitle" class="text-sm font-extrabold text-white truncate leading-tight">Place Name</h3>
              </div>
            </div>
            <button id="btnCloseCard" class="text-slate-400 hover:text-white p-1 rounded-lg">
              <i class="fa-solid fa-xmark text-sm"></i>
            </button>
          </div>
          <div class="mt-2.5 pt-2 border-t border-slate-800 flex items-center justify-between text-[11px]">
            <span id="cardTag" class="text-emerald-400 font-bold">● Active</span>
            <button id="btnCenterCard" class="text-sky-400 font-extrabold hover:underline flex items-center gap-1">
              Focus <i class="fa-solid fa-crosshairs"></i>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Side Location Drawer -->
    <aside id="sideListPanel" class="fixed md:static inset-y-0 right-0 w-80 max-w-[85vw] bg-slate-900 border-l border-slate-800 z-40 transform translate-x-full md:translate-x-0 transition-transform duration-200 ease-out flex flex-col shadow-2xl md:shadow-none">
      <div class="p-3 border-b border-slate-800 flex items-center justify-between">
        <h2 class="font-extrabold text-xs uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
          <i class="fa-solid fa-list-ul text-sky-400"></i>
          <span>Places</span>
          <span id="listCount" class="text-white ml-1 bg-slate-800 px-2 py-0.5 rounded-full text-[10px]">0</span>
        </h2>
        <button id="btnClosePanel" class="md:hidden text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>

      <!-- Items List -->
      <div id="itemList" class="flex-1 overflow-y-auto divide-y divide-slate-800/60 p-1.5">
        <!-- Rendered by JS -->
      </div>
    </aside>

    <!-- Mobile Backdrop -->
    <div id="panelBackdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 hidden md:hidden"></div>
  </div>

  <script>
    /* =====================================================================
       1. Exact Category Setup & High-Contrast Colors
       ===================================================================== */
    const categories = {
      show: {
        id: "show",
        name: "Timed Shows",
        color: "#ff2a55", // Vivid Neon Red-Pink
        icon: "fa-masks-theater",
        glow: "rgba(255, 42, 85, 0.45)"
      },
      indoor: {
        id: "indoor",
        name: "Indoor",
        color: "#00d2ff", // Neon Electric Blue
        icon: "fa-fish-fins",
        glow: "rgba(0, 210, 255, 0.45)"
      },
      outdoor: {
        id: "outdoor",
        name: "Outdoor",
        color: "#ffaa00", // Vivid Gold/Orange
        icon: "fa-sun",
        glow: "rgba(255, 170, 0, 0.45)"
      },
      dining: {
        id: "dining",
        name: "All-Day Dining",
        color: "#10b981", // Bright Emerald Green
        icon: "fa-utensils",
        glow: "rgba(16, 185, 129, 0.45)"
      },
      ride: {
        id: "ride",
        name: "Rides",
        color: "#b026ff", // Bright Purple
        icon: "fa-bolt",
        glow: "rgba(176, 38, 255, 0.45)"
      },
      restroom: {
        id: "restroom",
        name: "Restrooms",
        color: "#38bdf8", // Bright Sky Blue (Matches Park WC Signage)
        icon: "fa-restroom",
        glow: "rgba(56, 189, 248, 0.5)"
      }
    };

    /* =====================================================================
       2. Curated Locations (Only what the user asked for + All Park Restrooms)
       ===================================================================== */
    const places = [
      // 1. Timed Shows (3)
      { id: "orca", name: "Orca Encounter", cat: "show", x: 13.8, y: 71.5 },
      { id: "dolphin", name: "Dolphin Amphitheater", cat: "show", x: 50.8, y: 44.5 },
      { id: "sealion", name: "Sea Lion & Otter Amphitheater", cat: "show", x: 37.8, y: 27.5 },

      // 2. Indoor Exhibits / Aquarium (6)
      { id: "orcaUnder", name: "Orca Underwater Viewing", cat: "indoor", x: 23.5, y: 76.8 },
      { id: "penguin", name: "Penguin Encounter", cat: "indoor", x: 81.2, y: 44.8 },
      { id: "shark", name: "Shark Encounter", cat: "indoor", x: 53.0, y: 25.8 },
      { id: "turtle", name: "Turtle Reef", cat: "indoor", x: 58.2, y: 24.2 },
      { id: "wildArctic", name: "Wild Arctic", cat: "indoor", x: 80.5, y: 64.0 },
      { id: "jewelsOfTheSea", name: "Jewels of the Sea", cat: "indoor", x: 62.0, y: 79.5 },

      // 3. Outdoor Exhibits / Touch Pools (3)
      { id: "explorersReef", name: "Explorer's Reef Touch Pools", cat: "outdoor", x: 39.0, y: 76.5 },
      { id: "batray", name: "Bat Ray Shallows", cat: "outdoor", x: 24.8, y: 44.5 },
      { id: "dolphinPoint", name: "Dolphin Point", cat: "outdoor", x: 23.5, y: 61.0 },

      // 4. All-Day Dining Deal Participating Restaurants (Official 6 locations)
      { id: "shipwreckCafe", name: "Shipwreck Reef Café", cat: "dining", x: 13.5, y: 49.5 },
      { id: "explorercafe", name: "Explorer's Café", cat: "dining", x: 50.8, y: 79.5 },
      { id: "calypso", name: "Calypso Bay Smokehouse", cat: "dining", x: 61.2, y: 47.0 },
      { id: "hibisco", name: "Hibisco Modern Mexican", cat: "dining", x: 39.5, y: 45.8 },
      { id: "mantapizza", name: "Manta Pizza", cat: "dining", x: 30.2, y: 48.0 },
      { id: "chicken", name: "The Chicken Shack", cat: "dining", x: 41.5, y: 53.0 },

      // 5. Rides (Strictly only Rescue Jr. and Octarock)
      { id: "rescueJr", name: "Rescue Jr.", cat: "ride", x: 46.5, y: 64.0 },
      { id: "octarock", name: "Octarock", cat: "ride", x: 50.5, y: 74.0 },

      // 6. ALL Restrooms in SeaWorld San Diego (12 verified locations)
      { id: "restEntrance", name: "Restroom - Main Entrance", cat: "restroom", x: 42.5, y: 85.8 },
      { id: "restWhaleShop", name: "Restroom - Whale Shop", cat: "restroom", x: 13.2, y: 55.6 },
      { id: "restShipwreck", name: "Restroom - Shipwreck Rapids", cat: "restroom", x: 9.3, y: 33.6 },
      { id: "restOrcaWest", name: "Restroom - Orca West Plaza", cat: "restroom", x: 6.8, y: 76.5 },
      { id: "restOrcaEast", name: "Restroom - Orca Underwater Viewing", cat: "restroom", x: 29.5, y: 75.0 },
      { id: "restDolphin", name: "Restroom - Dolphin Amphitheater", cat: "restroom", x: 55.5, y: 44.5 },
      { id: "restSeaLion", name: "Restroom - Sea Lion Amphitheater", cat: "restroom", x: 36.8, y: 19.5 },
      { id: "restMissionBay", name: "Restroom - Mission Bay Theater", cat: "restroom", x: 37.0, y: 19.8 },
      { id: "restNautilus", name: "Restroom - Nautilus Amphitheater", cat: "restroom", x: 74.8, y: 59.2 },
      { id: "restWildArctic", name: "Restroom - Wild Arctic / Trading Post", cat: "restroom", x: 79.8, y: 62.5 },
      { id: "restEmperor", name: "Restroom - Emperor Plaza", cat: "restroom", x: 85.5, y: 82.5 },
      { id: "restExplorerCafe", name: "Restroom - Explorer's Café / Jewels", cat: "restroom", x: 54.8, y: 80.2 }
    ];

    /* =====================================================================
       3. State Management
       ===================================================================== */
    // 기본값을 'all'에서 'none'으로 변경하여 처음에는 깨끗한 상태로 시작
    let currentCategory = "none";
    let selectedPlaceId = null;

    // Pan & Zoom
    let scale = 1.0;
    const minScale = 0.35;
    const maxScale = 3.5;
    let pointX = 0;
    let pointY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    // Touch Pinch
    let touchStartDist = 0;
    let touchStartScale = 1;
    let touchStartMid = { x: 0, y: 0 };

    // DOM Elements
    const viewport = document.getElementById("viewport");
    const mapWrapper = document.getElementById("mapWrapper");
    const mapImage = document.getElementById("mapImage");
    const pinsLayer = document.getElementById("pinsLayer");
    const itemList = document.getElementById("itemList");
    const listCount = document.getElementById("listCount");
    const zoomDisplay = document.getElementById("zoomDisplay");
    const userMarker = document.getElementById("userMarker");
    const btnLocateMe = document.getElementById("btnLocateMe");

    const quickCard = document.getElementById("quickCard");
    const cardBadge = document.getElementById("cardBadge");
    const cardIcon = document.getElementById("cardIcon");
    const cardTitle = document.getElementById("cardTitle");
    const cardCategory = document.getElementById("cardCategory");
    const cardTag = document.getElementById("cardTag");
    const btnCloseCard = document.getElementById("btnCloseCard");
    const btnCenterCard = document.getElementById("btnCenterCard");

    const sideListPanel = document.getElementById("sideListPanel");
    const panelBackdrop = document.getElementById("panelBackdrop");
    const btnToggleList = document.getElementById("btnToggleList");
    const btnClosePanel = document.getElementById("btnClosePanel");
    const btnShowAll = document.getElementById("btnShowAll");

    /* =====================================================================
       4. Pan & Zoom Engine
       ===================================================================== */
    function updateTransform(smooth = false) {
      if (smooth) {
        mapWrapper.style.transition = "transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1)";
      } else {
        mapWrapper.style.transition = "none";
      }
      mapWrapper.style.transform = `translate3d(${pointX}px, ${pointY}px, 0) scale(${scale})`;
      zoomDisplay.textContent = `${Math.round(scale * 100)}%`;

      // 역배율 계산: 확대 시에도 핀이 너무 작아지거나 커지지 않고 또렷하게 보이도록 조절
      const pinScale = Math.max(0.75, 1 / Math.pow(scale, 0.45));
      const pins = document.querySelectorAll(".custom-pin");
      const labels = document.querySelectorAll(".custom-label");
      const uMarker = document.getElementById("userMarker");

      pins.forEach(el => {
        el.style.transform = `translate(-50%, -50%) scale(${pinScale})`;
      });
      labels.forEach(el => {
        el.style.transform = `translate(22px, -50%) scale(${pinScale})`;
        el.style.transformOrigin = "left center";
      });
      if (uMarker) {
        uMarker.style.transform = `translate(-50%, -50%) scale(${pinScale})`;
      }
    }

    function zoomTo(targetScale, clientX, clientY, smooth = true) {
      targetScale = Math.min(Math.max(minScale, targetScale), maxScale);
      const rect = viewport.getBoundingClientRect();
      const originX = clientX - rect.left;
      const originY = clientY - rect.top;

      pointX = originX - ((originX - pointX) / scale) * targetScale;
      pointY = originY - ((originY - pointY) / scale) * targetScale;
      scale = targetScale;

      updateTransform(smooth);
    }

    function fitToScreen() {
      const vW = viewport.clientWidth;
      const vH = viewport.clientHeight;
      const mW = mapImage.offsetWidth || 2200;
      const mH = mapImage.offsetHeight || 1485;

      const scaleX = vW / mW;
      const scaleY = vH / mH;
      scale = Math.max(scaleX, scaleY) * 1.05;
      scale = Math.min(Math.max(minScale, scale), 1.6);

      pointX = (vW - mW * scale) / 2;
      pointY = (vH - mH * scale) / 2;

      updateTransform(true);
    }

    function focusOnPin(pctX, pctY) {
      const vW = viewport.clientWidth;
      const vH = viewport.clientHeight;
      const mW = mapImage.offsetWidth || 2200;
      const mH = mapImage.offsetHeight || 1485;

      const targetX = (pctX / 100) * mW;
      const targetY = (pctY / 100) * mH;

      scale = Math.max(scale, 1.4);
      pointX = vW / 2 - targetX * scale;
      pointY = vH / 2 - targetY * scale;

      updateTransform(true);
    }

    /* =====================================================================
       5. Interaction Listeners
       ===================================================================== */
    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.16 : 0.86;
      zoomTo(scale * factor, e.clientX, e.clientY, false);
    }, { passive: false });

    viewport.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
      mapWrapper.style.transition = "none";
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      updateTransform(false);
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    viewport.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - pointX;
        startY = e.touches[0].clientY - pointY;
        mapWrapper.style.transition = "none";
      } else if (e.touches.length === 2) {
        isDragging = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchStartDist = Math.hypot(dx, dy);
        touchStartScale = scale;
        touchStartMid = {
          x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
          y: (e.touches[0].clientY + e.touches[1].clientY) / 2
        };
      }
    }, { passive: true });

    viewport.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1 && isDragging) {
        pointX = e.touches[0].clientX - startX;
        pointY = e.touches[0].clientY - startY;
        updateTransform(false);
      } else if (e.touches.length === 2 && touchStartDist > 0) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const factor = dist / touchStartDist;
        zoomTo(touchStartScale * factor, touchStartMid.x, touchStartMid.y, false);
      }
    }, { passive: true });

    viewport.addEventListener("touchend", () => {
      isDragging = false;
      touchStartDist = 0;
    });

    /* =====================================================================
       6. Render Logic & Empty State Handling
       ===================================================================== */
    function getActivePlaces() {
      if (currentCategory === "none") return [];
      if (currentCategory === "all") return places;
      return places.filter(p => p.cat === currentCategory);
    }

    function renderPins() {
      pinsLayer.innerHTML = "";
      const visible = getActivePlaces();

      visible.forEach(p => {
        const cat = categories[p.cat];
        const isSelected = (selectedPlaceId === p.id);

        // Pin Button - 기본 52px, 선택시 62px로 초대형 확대
        const pin = document.createElement("button");
        pin.className = `custom-pin ${isSelected ? 'active-pin' : ''}`;
        pin.style.left = `${p.x}%`;
        pin.style.top = `${p.y}%`;
        pin.style.width = isSelected ? "62px" : "52px";
        pin.style.height = isSelected ? "62px" : "52px";
        pin.style.backgroundColor = cat.color;
        pin.innerHTML = `<i class="fa-solid ${cat.icon} ${isSelected ? 'text-[26px]' : 'text-[22px]'} pointer-events-none"></i>`;
        pin.setAttribute("aria-label", p.name);

        // Bold Label
        const label = document.createElement("div");
        label.className = `custom-label ${isSelected ? 'active-label' : ''}`;
        label.style.left = `${p.x}%`;
        label.style.top = `${p.y}%`;
        label.innerHTML = `<span>${p.name}</span>`;

        pin.onclick = (e) => {
          e.stopPropagation();
          selectPlace(p.id, true);
        };

        pinsLayer.appendChild(pin);
        pinsLayer.appendChild(label);
      });

      updateTransform(false);
    }

    function renderList() {
      itemList.innerHTML = "";
      const visible = getActivePlaces();
      listCount.textContent = visible.length;

      if (visible.length === 0) {
        itemList.innerHTML = `
          <div class="text-center py-10 px-4 text-slate-500 text-xs">
            <i class="fa-solid fa-layer-group text-2xl mb-2 opacity-50 block"></i>
            No active filters.<br>Select a category above or tap <strong>Show All</strong>.
          </div>
        `;
        return;
      }

      visible.forEach(p => {
        const cat = categories[p.cat];
        const isSelected = (selectedPlaceId === p.id);

        const row = document.createElement("button");
        row.className = `w-full p-2.5 rounded-xl transition text-left flex items-center justify-between group ${isSelected ? 'bg-slate-800 ring-1 ring-sky-400' : 'hover:bg-slate-800/60'}`;
        row.innerHTML = `
          <div class="flex items-center gap-2.5 min-w-0 pr-1">
            <span class="w-7 h-7 rounded-lg flex items-center justify-center text-white text-xs flex-shrink-0 shadow-sm" style="background-color: ${cat.color}">
              <i class="fa-solid ${cat.icon}"></i>
            </span>
            <div class="min-w-0">
              <h4 class="text-xs font-bold text-slate-100 truncate group-hover:text-sky-300 transition">${p.name}</h4>
              <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">${cat.name}</p>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-500 text-[10px] group-hover:text-white transition flex-shrink-0"></i>
        `;

        row.onclick = () => {
          selectPlace(p.id, true);
          if (window.innerWidth < 768) {
            closeMobilePanel();
          }
        };

        itemList.appendChild(row);
      });
    }

    function selectPlace(id, shouldFocus = false) {
      selectedPlaceId = id;
      const place = places.find(p => p.id === id);

      if (place) {
        const cat = categories[place.cat];
        cardTitle.textContent = place.name;
        cardCategory.textContent = cat.name;
        cardBadge.style.backgroundColor = cat.color;
        cardIcon.className = `fa-solid ${cat.icon}`;

        quickCard.classList.remove("translate-y-4", "opacity-0", "pointer-events-none");

        if (shouldFocus) {
          focusOnPin(place.x, place.y);
        }
      } else {
        closeCard();
      }

      renderPins();
      renderList();
    }

    function closeCard() {
      selectedPlaceId = null;
      quickCard.classList.add("translate-y-4", "opacity-0", "pointer-events-none");
      renderPins();
      renderList();
    }

    /* =====================================================================
       7. Toggle Category Logic (선택된 카테고리를 다시 누르면 "none"으로 전환되어 모두 숨김)
       ===================================================================== */
    function setCategory(catId) {
      if (currentCategory === catId) {
        currentCategory = "none"; // 아무것도 보이지 않게 처리
      } else {
        currentCategory = catId;
      }
      updateFilterButtonsUI();
      selectedPlaceId = null;
      closeCard();
      renderPins();
      renderList();
    }

    function updateFilterButtonsUI() {
      document.querySelectorAll(".filter-btn").forEach(btn => {
        const cat = btn.dataset.cat;
        if (cat === currentCategory) {
          btn.classList.remove("bg-slate-800", "text-slate-300", "border-slate-700");
          btn.classList.add("bg-white", "text-slate-950", "border-white", "shadow-lg");
        } else {
          btn.classList.remove("bg-white", "text-slate-950", "border-white", "shadow-lg");
          btn.classList.add("bg-slate-800", "text-slate-300", "border-slate-700");
        }
      });

      if (currentCategory === "all") {
        btnShowAll.classList.add("text-sky-400", "bg-slate-700");
        btnShowAll.classList.remove("text-slate-400", "bg-slate-800");
      } else {
        btnShowAll.classList.remove("text-sky-400", "bg-slate-700");
        btnShowAll.classList.add("text-slate-400", "bg-slate-800");
      }
    }

    // Bind Filter Click Events
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => setCategory(btn.dataset.cat));
    });

    btnShowAll.addEventListener("click", () => {
      currentCategory = (currentCategory === "all") ? "none" : "all";
      updateFilterButtonsUI();
      closeCard();
      renderPins();
      renderList();
    });

    // Control Buttons
    document.getElementById("btnZoomIn").addEventListener("click", () => {
      zoomTo(scale * 1.3, viewport.clientWidth / 2, viewport.clientHeight / 2);
    });

    document.getElementById("btnZoomOut").addEventListener("click", () => {
      zoomTo(scale / 1.3, viewport.clientWidth / 2, viewport.clientHeight / 2);
    });

    document.getElementById("btnZoomReset").addEventListener("click", () => {
      zoomTo(1.0, viewport.clientWidth / 2, viewport.clientHeight / 2);
    });

    document.getElementById("btnRecenter").addEventListener("click", fitToScreen);

    btnCloseCard.addEventListener("click", closeCard);
    btnCenterCard.addEventListener("click", () => {
      const place = places.find(p => p.id === selectedPlaceId);
      if (place) focusOnPin(place.x, place.y);
    });

    /* =====================================================================
       GPS Geolocation Calibration (SeaWorld San Diego Bounds)
       ===================================================================== */
    // 테마파크 경계 (위도, 경도)
    const SW_BOUNDS = {
      north: 32.7678, // 최북단 (Skyride / Bay area)
      south: 32.7618, // 최남단 (Entrance area)
      west: -117.2302, // 최서단 (Orca Stadium / Shipwreck)
      east: -117.2215  // 최동단 (Emperor coaster)
    };

    let watchId = null;

    function gpsToMapCoords(lat, lng) {
      // 0 ~ 100% 비율로 변환
      let xPct = ((lng - SW_BOUNDS.west) / (SW_BOUNDS.east - SW_BOUNDS.west)) * 100;
      let yPct = ((SW_BOUNDS.north - lat) / (SW_BOUNDS.north - SW_BOUNDS.south)) * 100;

      // 일러스트 지도의 왜곡을 감안한 안전 범위 클램핑
      xPct = Math.max(3, Math.min(97, xPct));
      yPct = Math.max(3, Math.min(97, yPct));
      return { x: xPct, y: yPct };
    }

    function updateUserMarker(lat, lng, focus = false) {
      const coords = gpsToMapCoords(lat, lng);
      userMarker.style.left = `${coords.x}%`;
      userMarker.style.top = `${coords.y}%`;
      userMarker.classList.remove("hidden");

      if (focus) {
        focusOnPin(coords.x, coords.y);
      }
    }

    function toggleGPS() {
      if (!("geolocation" in navigator)) {
        showToast("GPS is not supported by your browser.");
        return;
      }

      if (watchId !== null) {
        // 이미 켜져 있는 경우 끄기
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        userMarker.classList.add("hidden");
        btnLocateMe.classList.remove("bg-emerald-600", "hover:bg-emerald-500");
        btnLocateMe.classList.add("bg-blue-600", "hover:bg-blue-500");
        btnLocateMe.innerHTML = `<i class="fa-solid fa-location-crosshairs text-white animate-pulse"></i><span>My Location</span>`;
        return;
      }

      btnLocateMe.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-white"></i><span>Locating...</span>`;

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          // 사용자가 실제로 씨월드 근처(약 1.5km 반경)에 있는지 확인
          const inPark = (lat >= SW_BOUNDS.south - 0.005 && lat <= SW_BOUNDS.north + 0.005 &&
                          lng >= SW_BOUNDS.west - 0.005 && lng <= SW_BOUNDS.east + 0.005);

          btnLocateMe.classList.remove("bg-blue-600", "hover:bg-blue-500");
          btnLocateMe.classList.add("bg-emerald-600", "hover:bg-emerald-500");
          btnLocateMe.innerHTML = `<i class="fa-solid fa-location-dot text-white"></i><span>Live GPS</span>`;

          if (inPark) {
            updateUserMarker(lat, lng, true);
          } else {
            // 파크 외부에 있을 때는 입구(Entrance) 지점에 샘플 위치 표시
            updateUserMarker(32.7632, -117.2265, true);
            showToast("Showing near Main Entrance (Outside park detected)");
          }

          // 지속적인 실시간 추적 시작
          watchId = navigator.geolocation.watchPosition((newPos) => {
            updateUserMarker(newPos.coords.latitude, newPos.coords.longitude, false);
          }, null, { enableHighAccuracy: true });
        },
        (err) => {
          btnLocateMe.innerHTML = `<i class="fa-solid fa-location-crosshairs text-white"></i><span>My Location</span>`;
          // 권한 거부 또는 오류 시 입구에 시뮬레이션 마커 제공
          updateUserMarker(32.7632, -117.2265, true);
          showToast("GPS permission denied or unavailable. Centered at Entrance.");
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    function showToast(msg) {
      const toast = document.createElement("div");
      toast.className = "fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border border-slate-700 text-sky-400 text-xs px-4 py-2.5 rounded-full shadow-2xl z-50 pointer-events-none transition-opacity duration-300 font-semibold";
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    btnLocateMe.addEventListener("click", toggleGPS);

    // Mobile Panel
    function openMobilePanel() {
      sideListPanel.classList.remove("translate-x-full");
      panelBackdrop.classList.remove("hidden");
    }

    function closeMobilePanel() {
      sideListPanel.classList.add("translate-x-full");
      panelBackdrop.classList.add("hidden");
    }

    btnToggleList.addEventListener("click", openMobilePanel);
    btnClosePanel.addEventListener("click", closeMobilePanel);
    panelBackdrop.addEventListener("click", closeMobilePanel);

    window.addEventListener("resize", () => {
      if (window.innerWidth >= 768) {
        panelBackdrop.classList.add("hidden");
      }
    });

    /* =====================================================================
       8. Initialize
       ===================================================================== */
    window.addEventListener("load", () => {
      updateFilterButtonsUI();
      renderPins();
      renderList();

      if (mapImage.complete) {
        fitToScreen();
      } else {
        mapImage.onload = () => fitToScreen();
      }

      // 페이지 로드 시 자동으로 내 위치(GPS) 추적 시작
      toggleGPS();
    });
  </script>
</body>
</html>
